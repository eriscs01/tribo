name: CI

on:
  pull_request:
    branches: [main]
    # labeled and unlabeled rerun the pipeline so "API breaking changes" sees the api-breaking label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    # A release tag also publishes both images (job "publish").
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests that change documentation only (decision 0013) skip the steps of the jobs below
# that spend runner time. The job itself still runs and reports success, because a required check
# that never reports blocks the merge; a skipped step is what a docs-only run looks like (runbook,
# "Maintaining the repository"). Steps are gated on `needs.changes.outputs.code != 'false'`, so an
# empty output (the Changes job failed) runs everything. Jobs that need a result from the Changes
# job carry `if: ${{ !cancelled() }}` for the same reason: a failed need must not skip them.
jobs:
  # Decides whether a pull request touches code; every other event runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # The pull request's merge commit with its two parents: HEAD^1 is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: decide
        run: node packages/story-kit/src/scripts/ci-changes.ts "$GITHUB_EVENT_NAME"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # ESLint, Prettier, the dependency-cruiser module boundary rules and squawk over the migrations.
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      - uses: ./.github/actions/build-cache
        if: needs.changes.outputs.code != 'false'
      - run: pnpm typecheck
        if: needs.changes.outputs.code != 'false'
      # The SPA and its app-shell service worker (Vite + Workbox), from the types tsc just built.
      - run: pnpm build:web
        if: needs.changes.outputs.code != 'false'
      # Initial JS ≤ 200 KB gzip (technical design, Operations › Performance); prints the size.
      - run: pnpm check:bundle
        if: needs.changes.outputs.code != 'false'

  # Pull requests only: packages/contract/openapi.json against the base branch's copy with
  # oasdiff (pinned release, checksum verified, no service). A breaking change fails the job
  # unless the pull request carries the api-breaking label; the changelog goes to the summary.
  api:
    name: API breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: 1.33.0
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oasdiff
        run: |
          curl --fail --silent --show-error --location --retry 3 --output oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "$OASDIFF_SHA256  oasdiff.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/oasdiff"
          tar -xzf oasdiff.tar.gz -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >>"$GITHUB_PATH"
      - name: Fetch the base branch's contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:packages/contract/openapi.json" >"$RUNNER_TEMP/openapi.base.json"
      - name: Compare the contracts
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: .github/scripts/api-breaking.sh "$RUNNER_TEMP/openapi.base.json" packages/contract/openapi.json

  # Generic secrets (GitHub's push protection only knows provider tokens): gitleaks over the
  # pull request's commits, or the whole history on a push. Pinned release, checksum verified,
  # no licence key and no paid action; allowlist entries live in .gitleaks.toml.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"
      # --redact keeps a finding's value out of the public log; the file, line and rule remain.
      - name: Scan the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --redact --no-banner .
          fi

  # Unit, Integration and Leak properties each run once, with V8 coverage, and keep a blob report
  # of the run (test results and raw coverage); Coverage merges the three and enforces the
  # floors. Under --coverage the tests import the TypeScript source, so these jobs need no build.
  unit:
    name: Unit
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      - run: pnpm test:ci --project unit --outputFile.blob=vitest-reports/unit.json
        if: needs.changes.outputs.code != 'false'
      - uses: ./.github/actions/upload-blob
        if: needs.changes.outputs.code != 'false'
        with:
          name: unit

  # Integration and leak tests start PostgreSQL 18 through Testcontainers on the runner's Docker.
  integration:
    name: Integration
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      - run: pnpm test:ci --project integration --outputFile.blob=vitest-reports/integration.json
        if: needs.changes.outputs.code != 'false'
      - uses: ./.github/actions/upload-blob
        if: needs.changes.outputs.code != 'false'
        with:
          name: integration

  leak:
    name: Leak properties
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      # Fixed seed (the testkit default) so pushes are reproducible; random seeds run in nightly.yml.
      - run: pnpm test:ci --project leak --outputFile.blob=vitest-reports/leak.json
        if: needs.changes.outputs.code != 'false'
      - uses: ./.github/actions/upload-blob
        if: needs.changes.outputs.code != 'false'
        with:
          name: leak

  # Merges the three blob reports into one coverage run (no PostgreSQL, no test is run again):
  # the floors in vitest.config.ts fail the job, the summary goes to the run page and the HTML
  # report is kept as an artifact. No coverage service and no token: nothing leaves GitHub.
  coverage:
    name: Coverage
    needs: [changes, unit, integration, leak]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A test job that failed has no blob report: the merge below must not pass without it.
      - name: Require the three test jobs
        if: needs.changes.outputs.code != 'false'
        env:
          RESULTS: ${{ needs.unit.result }} ${{ needs.integration.result }} ${{ needs.leak.result }}
        run: |
          echo "unit, integration, leak: $RESULTS"
          [ "$RESULTS" = "success success success" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: vitest-blob-*
          path: vitest-reports
          merge-multiple: true
      - run: pnpm test:ci:merge
        if: needs.changes.outputs.code != 'false'
      - name: Summarise the coverage
        if: always() && needs.changes.outputs.code != 'false'
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          {
            echo "| Coverage | Covered | Total | % |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.total | to_entries[] | select(.key | IN("lines", "statements", "functions", "branches"))
              | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) |"' \
              coverage/coverage-summary.json
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.code != 'false'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Job 6, in three parts that run at once: the lockfile scan, and one build and Trivy scan
  # per image. "Build and scan" (the required check) passes only when all of them do.
  # GitHub's dependency graph does not read pnpm 12's lockfile, so it kept vite 8.3.2 after #54 and
  # Dependabot alerts stayed open. This submits the resolved graph on every push to main (decision
  # 0010). It is not a required check and needs no other job: a red test run must not freeze the graph.
  dependency-graph:
    name: Dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The dependency submission API needs write access to contents, nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm submit:deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile:
    name: Scan the lockfile
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      # osv-scanner fails on any finding; only those of CVSS 7 or more (or unscored) fail the job.
      - name: Scan the lockfile (osv-scanner)
        if: needs.changes.outputs.code != 'false'
        run: |
          set +e
          docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER" scan source \
            --config /src/osv-scanner.toml --lockfile /src/pnpm-lock.yaml --format json >osv.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]
            | select((.max_severity // "") == "" or (.max_severity | tonumber) >= 7)
            | "\($p.name)@\($p.version): \(.ids | join(", ")) (CVSS \(if (.max_severity // "") == "" then "unscored" else .max_severity end))"' \
            osv.json >blocking.txt
          if [ -s blocking.txt ]; then
            echo "High or critical findings without a recorded exception in osv-scanner.toml:"
            cat blocking.txt
            exit 1
          fi
    env:
      OSV_SCANNER: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa

  # The images are built as End to end runs them (the same tags and release build arguments),
  # scanned, and passed on as artifacts: what Trivy scanned is what the walking skeleton tests
  # and, on a release tag, what Publish pushes (decision 0014). On a tag the app is built with
  # the tag as its release version; everywhere else with `ci`. The local tag is `:ci` either way.
  image:
    name: Build and scan (${{ matrix.image }})
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: deploy/app/Dockerfile
            build-args: |
              TRIBO_RELEASE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
              TRIBO_RELEASE_COMMIT=${{ github.sha }}
          - image: proxy
            dockerfile: deploy/caddy/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.code != 'false'
      - name: Build the image
        if: needs.changes.outputs.code != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ghcr.io/eriscs01/tribo-${{ matrix.image }}:ci
          build-args: ${{ matrix.build-args }}
          load: true
          cache-from: type=gha,scope=tribo-${{ matrix.image }}
          # Only main fills the layer cache: a pull request's export (a minute of uploads at worst)
          # would serve nobody but itself.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope=tribo-{0},mode=max', matrix.image) || '' }}
      # Trivy's vulnerability database, one cache entry a day shared by both scans (the key is
      # the UTC date, not the run), so the repository's cache holds one copy rather than two
      # per run. A day's first scan restores the latest earlier copy, and Trivy downloads a
      # new database only when that copy is past its next-update time; the entry is saved
      # under the new day's key.
      - name: Name the Trivy database's day
        id: trivy-day
        if: needs.changes.outputs.code != 'false'
        run: echo "day=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - name: Restore the Trivy database
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-db
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-db-
      # Findings with no fixed version are left out: no image change could clear them.
      - name: Scan the image (Trivy)
        if: needs.changes.outputs.code != 'false'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" \
            -v "$PWD/.trivy-db:/root/.cache/trivy/db" "$TRIVY" \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml "ghcr.io/eriscs01/tribo-${{ matrix.image }}:ci"
      # The database the scan used, in the log: when it was built and when it goes stale.
      - name: Show the Trivy database's age
        if: needs.changes.outputs.code != 'false'
        run: cat .trivy-db/metadata.json
      # Only an image that passed the scan is passed on. gzip -1: fast, and the layers are
      # compressed already. Its id goes into the log and the run summary, for Publish's to be
      # compared with (the summary shows only to signed-in viewers; the log reaches `gh run view`).
      - name: Save the scanned image
        if: needs.changes.outputs.code != 'false'
        env:
          IMAGE: ghcr.io/eriscs01/tribo-${{ matrix.image }}:ci
        run: |
          docker save "$IMAGE" | gzip -1 >image.tar.gz
          echo "Scanned \`$IMAGE\`: id \`$(docker image inspect --format '{{.Id}}' "$IMAGE")\`" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          name: image-${{ matrix.image }}
          path: image.tar.gz
          compression-level: 0
          retention-days: 1
    env:
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

  images:
    name: Build and scan
    if: always()
    needs: [lockfile, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the lockfile scan and both image jobs
        env:
          RESULTS: ${{ needs.lockfile.result }} ${{ needs.image.result }}
        run: |
          echo "lockfile, images: $RESULTS"
          [ "$RESULTS" = "success success" ]

  # Job 7: exit criteria 1–2 (apps/e2e) in a browser against deploy/compose.yml, run from the
  # images job 6 built and scanned (loaded from its artifacts, not rebuilt) in the internal TLS
  # mode. It runs on pull requests too, because a required check must report on the PR it guards.
  e2e:
    name: End to end
    needs: [changes, images]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What the test's `docker compose exec` and the stack's own variables read.
      COMPOSE_FILE: deploy/compose.yml
      TRIBO_VERSION: ci
      TRIBO_PUBLIC_URL: https://tribo.localhost
      TRIBO_TLS_MODE: internal
    steps:
      # The images job must have passed; a skipped needs-gate would otherwise let this run alone.
      - name: Require the build and scan
        if: needs.changes.outputs.code != 'false'
        env:
          RESULT: ${{ needs.images.result }}
        run: |
          echo "build and scan: $RESULT"
          [ "$RESULT" = "success" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      - uses: ./.github/actions/build-cache
        if: needs.changes.outputs.code != 'false'
      # The test imports @tribo/contract and @tribo/testkit through their built dist.
      - run: pnpm build
        if: needs.changes.outputs.code != 'false'
      # The stack runs on the oldest Docker Engine and Compose the release supports, so the
      # floor in deploy/docker-minimum.env is tested, not assumed; docker-check.sh must pass.
      - name: Read the Docker floor
        if: needs.changes.outputs.code != 'false'
        run: grep -E '^DOCKER_[A-Z_]+=' deploy/docker-minimum.env >>"$GITHUB_ENV"
      - uses: ./.github/actions/docker
        if: needs.changes.outputs.code != 'false'
        with:
          engine: ${{ env.DOCKER_ENGINE_MIN }}
          compose: ${{ env.DOCKER_COMPOSE_MIN }}
      - run: sh deploy/docker-check.sh
        if: needs.changes.outputs.code != 'false'
      # The two images the scan jobs built and Trivy passed; loaded after the engine is in place.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: image-*
          path: images
      - name: Load the scanned images
        if: needs.changes.outputs.code != 'false'
        run: |
          for archive in images/*/image.tar.gz; do gunzip --stdout "$archive" | docker load; done
          docker image ls
      # Throwaway secrets for this run only. Compose ignores the secrets' uid, gid and mode
      # outside Swarm and bind-mounts the files as they are, so the db and app users must be
      # able to read them.
      - name: Create the secrets
        if: needs.changes.outputs.code != 'false'
        working-directory: deploy
        run: |
          mkdir secrets
          openssl rand -out secrets/app_key 32
          for name in db_superuser_password db_owner_password db_app_password; do
            openssl rand -hex 32 >"secrets/$name"
          done
          chmod 644 secrets/*
      # The two images just loaded are used as they are; only PostgreSQL is pulled.
      - name: Start the stack
        if: needs.changes.outputs.code != 'false'
        run: |
          docker compose up -d --wait
          curl --fail --silent --insecure --retry 30 --retry-delay 2 --retry-all-errors \
            "$TRIBO_PUBLIC_URL/healthz"
      # The browser is cached by Playwright version, and only the headless shell the test uses is
      # installed, without --with-deps: the runner image already has Chrome's libraries, and
      # apt-get on its mirror is where this step used to stall for ten minutes.
      - name: Read the Playwright version
        id: playwright
        if: needs.changes.outputs.code != 'false'
        run: echo "version=$(pnpm --filter @tribo/e2e exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
      - name: Restore the Playwright browser
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        if: needs.changes.outputs.code != 'false'
        timeout-minutes: 5
        run: pnpm --filter @tribo/e2e exec playwright install --only-shell chromium
      - run: pnpm test:e2e
        if: needs.changes.outputs.code != 'false'
      # The release reaches the running app from the build: the start-up line and the CLI.
      - name: The app names its release
        if: needs.changes.outputs.code != 'false'
        env:
          RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
        run: |
          docker compose logs --no-color app | grep '"msg":"starting"' | grep -F "\"commit\":\"$GITHUB_SHA\""
          docker compose exec -T app tribo release show | grep -Fx "Tribo $RELEASE ($GITHUB_SHA)"
      - name: Save the stack's logs
        if: failure()
        run: |
          mkdir -p apps/e2e/playwright-report
          docker compose logs --no-color >apps/e2e/playwright-report/compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: apps/e2e/playwright-report/
          retention-days: 14

  # Release tags only: push both images to GHCR under the tag that deploy/compose.yml pulls
  # through TRIBO_VERSION, once every other job has passed, End to end included: a tag whose
  # walking skeleton fails is never published. The images pushed are the artifacts job 6 built
  # and Trivy passed, loaded and retagged, never rebuilt (decision 0014).
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, unit, integration, leak, coverage, images, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # The image names in deploy/compose.yml.
      REGISTRY: ghcr.io/eriscs01
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The digests go into the log and the run summary, for the release notes and the runbook's
      # table, beside each image's id, which matches the one the scan job recorded. Bash with
      # pipefail, so a failed push fails the step although its output goes through tee.
      - name: Push the scanned images
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "| Image | Id | Digest |"
            echo "| --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          for image in app proxy; do
            gunzip --stdout "images/image-$image/image.tar.gz" | docker load
            docker tag "$REGISTRY/tribo-$image:ci" "$REGISTRY/tribo-$image:$TAG"
            docker push "$REGISTRY/tribo-$image:$TAG" | tee push.log
            digest=$(grep -o 'digest: sha256:[0-9a-f]*' push.log | cut -d' ' -f2)
            [ -n "$digest" ]
            id=$(docker image inspect --format '{{.Id}}' "$REGISTRY/tribo-$image:$TAG")
            echo "| $REGISTRY/tribo-$image:$TAG | \`$id\` | \`$digest\` |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
