name: CI

on:
  pull_request:
    branches: [main]
    # labeled and unlabeled rerun the pipeline so "API breaking changes" sees the api-breaking label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    # A release tag also publishes both images (job "publish").
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # ESLint, Prettier, the dependency-cruiser module boundary rules and squawk over the migrations.
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      # The SPA and its app-shell service worker (Vite + Workbox), from the types tsc just built.
      - run: pnpm build:web
      # Initial JS ≤ 200 KB gzip (technical design, Operations › Performance); prints the size.
      - run: pnpm check:bundle

  # Pull requests only: packages/contract/openapi.json against the base branch's copy with
  # oasdiff (pinned release, checksum verified, no service). A breaking change fails the job
  # unless the pull request carries the api-breaking label; the changelog goes to the summary.
  api:
    name: API breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: 1.33.0
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oasdiff
        run: |
          curl --fail --silent --show-error --location --retry 3 --output oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "$OASDIFF_SHA256  oasdiff.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/oasdiff"
          tar -xzf oasdiff.tar.gz -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >>"$GITHUB_PATH"
      - name: Fetch the base branch's contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:packages/contract/openapi.json" >"$RUNNER_TEMP/openapi.base.json"
      - name: Compare the contracts
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: .github/scripts/api-breaking.sh "$RUNNER_TEMP/openapi.base.json" packages/contract/openapi.json

  # Generic secrets (GitHub's push protection only knows provider tokens): gitleaks over the
  # pull request's commits, or the whole history on a push. Pinned release, checksum verified,
  # no licence key and no paid action; allowlist entries live in .gitleaks.toml.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"
      # --redact keeps a finding's value out of the public log; the file, line and rule remain.
      - name: Scan the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --redact --no-banner .
          fi

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Workspace packages resolve through their built dist.
      - run: pnpm build
      - run: pnpm test:unit

  # Integration and leak tests start PostgreSQL 18 through Testcontainers on the runner's Docker.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Workspace packages resolve through their built dist.
      - run: pnpm build
      - run: pnpm test:integration

  leak:
    name: Leak properties
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Workspace packages resolve through their built dist.
      - run: pnpm build
      # Fixed seed (the testkit default) so pushes are reproducible; random seeds run in nightly.yml.
      - run: pnpm test:leak

  # All three test projects against the TypeScript source, with V8 coverage computed on the
  # runner: the floors in vitest.config.ts fail the job, the summary goes to the run page and
  # the HTML report is kept as an artifact. No coverage service and no token: nothing leaves
  # GitHub.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Summarise the coverage
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          {
            echo "| Coverage | Covered | Total | % |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.total | to_entries[] | select(.key | IN("lines", "statements", "functions", "branches"))
              | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) |"' \
              coverage/coverage-summary.json
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Job 6, in three parts that run at once: the lockfile scan, and one build and Trivy scan
  # per image. "Build and scan" (the required check) passes only when all of them do.
  # GitHub's dependency graph does not read pnpm 12's lockfile, so it kept vite 8.3.2 after #54 and
  # Dependabot alerts stayed open. This submits the resolved graph on every push to main (decision
  # 0010). It is not a required check and needs no other job: a red test run must not freeze the graph.
  dependency-graph:
    name: Dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The dependency submission API needs write access to contents, nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm submit:deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile:
    name: Scan the lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # osv-scanner fails on any finding; only those of CVSS 7 or more (or unscored) fail the job.
      - name: Scan the lockfile (osv-scanner)
        run: |
          set +e
          docker run --rm -v "$PWD:/src:ro" "$OSV_SCANNER" scan source \
            --config /src/osv-scanner.toml --lockfile /src/pnpm-lock.yaml --format json >osv.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]
            | select((.max_severity // "") == "" or (.max_severity | tonumber) >= 7)
            | "\($p.name)@\($p.version): \(.ids | join(", ")) (CVSS \(if (.max_severity // "") == "" then "unscored" else .max_severity end))"' \
            osv.json >blocking.txt
          if [ -s blocking.txt ]; then
            echo "High or critical findings without a recorded exception in osv-scanner.toml:"
            cat blocking.txt
            exit 1
          fi
    env:
      OSV_SCANNER: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa

  image:
    name: Build and scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: deploy/app/Dockerfile
          - image: proxy
            dockerfile: deploy/caddy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: tribo-${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=tribo-${{ matrix.image }}
          cache-to: type=gha,scope=tribo-${{ matrix.image }},mode=max
      # Trivy's vulnerability database from the latest run; Trivy downloads a new one only when
      # this copy is past its next-update time.
      - name: Restore the Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-db
          key: trivy-db-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: trivy-db-
      # Findings with no fixed version are left out: no image change could clear them.
      - name: Scan the image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" \
            -v "$PWD/.trivy-db:/root/.cache/trivy/db" "$TRIVY" \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml "tribo-${{ matrix.image }}:ci"
    env:
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

  images:
    name: Build and scan
    if: always()
    needs: [lockfile, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the lockfile scan and both image jobs
        env:
          RESULTS: ${{ needs.lockfile.result }} ${{ needs.image.result }}
        run: |
          echo "lockfile, images: $RESULTS"
          [ "$RESULTS" = "success success" ]

  # Job 7: exit criteria 1–2 (apps/e2e) in a browser against deploy/compose.yml, run from the
  # images job 6 scanned (rebuilt here from its layer cache) in the internal TLS mode. It runs
  # on pull requests too, because a required check must report on the PR it guards.
  e2e:
    name: End to end
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What the test's `docker compose exec` and the stack's own variables read.
      COMPOSE_FILE: deploy/compose.yml
      TRIBO_VERSION: ci
      TRIBO_PUBLIC_URL: https://tribo.localhost
      TRIBO_TLS_MODE: internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The test imports @tribo/contract and @tribo/testkit through their built dist.
      - run: pnpm build
      # The stack runs on the oldest Docker Engine and Compose the release supports, so the
      # floor in deploy/docker-minimum.env is tested, not assumed; docker-check.sh must pass.
      - name: Read the Docker floor
        run: grep -E '^DOCKER_[A-Z_]+=' deploy/docker-minimum.env >>"$GITHUB_ENV"
      - uses: ./.github/actions/docker
        with:
          engine: ${{ env.DOCKER_ENGINE_MIN }}
          compose: ${{ env.DOCKER_COMPOSE_MIN }}
      - run: sh deploy/docker-check.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/app/Dockerfile
          tags: ghcr.io/eriscs01/tribo-app:ci
          load: true
          cache-from: type=gha,scope=tribo-app
          build-args: |
            TRIBO_RELEASE_VERSION=ci
            TRIBO_RELEASE_COMMIT=${{ github.sha }}
      - name: Build the proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/caddy/Dockerfile
          tags: ghcr.io/eriscs01/tribo-proxy:ci
          load: true
          cache-from: type=gha,scope=tribo-proxy
      # Throwaway secrets for this run only. Compose ignores the secrets' uid, gid and mode
      # outside Swarm and bind-mounts the files as they are, so the db and app users must be
      # able to read them.
      - name: Create the secrets
        working-directory: deploy
        run: |
          mkdir secrets
          openssl rand -out secrets/app_key 32
          for name in db_superuser_password db_owner_password db_app_password; do
            openssl rand -hex 32 >"secrets/$name"
          done
          chmod 644 secrets/*
      # The two images just built are used as they are; only PostgreSQL is pulled.
      - name: Start the stack
        run: |
          docker compose up -d --wait
          curl --fail --silent --insecure --retry 30 --retry-delay 2 --retry-all-errors \
            "$TRIBO_PUBLIC_URL/healthz"
      - run: pnpm --filter @tribo/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The release reaches the running app from the build: the start-up line and the CLI.
      - name: The app names its release
        run: |
          docker compose logs --no-color app | grep '"msg":"starting"' | grep -F "\"commit\":\"$GITHUB_SHA\""
          docker compose exec -T app tribo release show | grep -Fx "Tribo ci ($GITHUB_SHA)"
      - name: Save the stack's logs
        if: failure()
        run: |
          mkdir -p apps/e2e/playwright-report
          docker compose logs --no-color >apps/e2e/playwright-report/compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: apps/e2e/playwright-report/
          retention-days: 14

  # Release tags only: push both images to GHCR under the tag that deploy/compose.yml pulls
  # through TRIBO_VERSION, once every other job has passed, End to end included: a tag whose
  # walking skeleton fails is never published.
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, unit, integration, leak, coverage, images, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # The image names in deploy/compose.yml.
      REGISTRY: ghcr.io/eriscs01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the app image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/app/Dockerfile
          tags: ${{ env.REGISTRY }}/tribo-app:${{ github.ref_name }}
          push: true
          cache-from: type=gha,scope=tribo-app
          build-args: |
            TRIBO_RELEASE_VERSION=${{ github.ref_name }}
            TRIBO_RELEASE_COMMIT=${{ github.sha }}
      - name: Push the proxy image
        id: proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/caddy/Dockerfile
          tags: ${{ env.REGISTRY }}/tribo-proxy:${{ github.ref_name }}
          push: true
          cache-from: type=gha,scope=tribo-proxy
      # The digests go into the run summary, for the release notes and the runbook's table.
      - name: Record the digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          PROXY_DIGEST: ${{ steps.proxy.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| $REGISTRY/tribo-app:$TAG | \`$APP_DIGEST\` |"
            echo "| $REGISTRY/tribo-proxy:$TAG | \`$PROXY_DIGEST\` |"
          } >>"$GITHUB_STEP_SUMMARY"
