name: Docker
description: Docker Engine (and optionally Compose) at exact versions, from download.docker.com as on the host (runbook step 4), in place of the runner's own.
inputs:
  engine:
    description: Docker Engine version, e.g. 29.8.2
    required: true
  compose:
    description: Compose plugin version, e.g. 2.35.0; empty keeps the runner's
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        COMPOSE: ${{ inputs.compose }}
        # Docker's release signing key, as published at docs.docker.com/engine/install.
        DOCKER_KEY_FINGERPRINT: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      run: |
        set -euo pipefail
        key=$(mktemp)
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o "$key"
        fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '/^fpr/ { print $10; exit }')
        if [ "$fingerprint" != "$DOCKER_KEY_FINGERPRINT" ]; then
          echo "Docker signing key has fingerprint $fingerprint, expected $DOCKER_KEY_FINGERPRINT" >&2
          exit 1
        fi
        sudo install -D -m 644 "$key" /etc/apt/keyrings/docker.asc
        # One source for Docker's repository, so apt sees no conflicting Signed-By.
        sudo rm -f /etc/apt/sources.list.d/docker.list /etc/apt/sources.list.d/docker.sources
        . /etc/os-release
        printf 'Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nSigned-By: /etc/apt/keyrings/docker.asc\n' \
          "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null
        sudo apt-get update -q
        # The package version for an upstream one: 29.8.2 -> 5:29.8.2-1~ubuntu.24.04~noble.
        package_version() {
          apt-cache madison "$1" | awk -v want="$2-" '{ v = $3; sub(/^[0-9]+:/, "", v) }
            index(v, want) == 1 { print $3; exit }'
        }
        engine=$(package_version docker-ce "$ENGINE")
        [ -n "$engine" ] || { echo "docker-ce $ENGINE is not in Docker's repository for $VERSION_CODENAME" >&2; exit 1; }
        packages=("docker-ce=$engine" "docker-ce-cli=$engine")
        if [ -n "$COMPOSE" ]; then
          compose=$(package_version docker-compose-plugin "$COMPOSE")
          [ -n "$compose" ] || { echo "docker-compose-plugin $COMPOSE is not in Docker's repository for $VERSION_CODENAME" >&2; exit 1; }
          packages+=("docker-compose-plugin=$compose")
        fi
        sudo apt-get install -y -q --allow-downgrades "${packages[@]}"
        docker version --format 'Docker Engine {{.Server.Version}}'
        docker compose version
