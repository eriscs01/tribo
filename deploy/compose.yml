# Production stack (docs/runbook.md). In the deploy directory: copy .env.example to .env, create
# the secrets in secrets/, then `docker compose pull && docker compose up -d`.
#   :443 → proxy (Caddy, TLS per TRIBO_TLS_MODE) → /v1, /healthz: app → db (PostgreSQL 18)
#                                                → everything else: the SPA built into the proxy image
# With COMPOSE_PROFILES=tunnel, cloudflared carries the traffic in and no port needs to be open.
name: tribo

x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: { max-size: 20m, max-file: '5' }

services:
  db:
    <<: *service
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      TRIBO_BOOTSTRAP_SQL: /tribo/migrations/0000_bootstrap.sql
    secrets: [db_superuser_password, db_owner_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      # The roles and the database come from the release's own app image, so the host needs
      # nothing beyond this directory. They run once, on an empty data volume.
      - type: image
        source: ghcr.io/eriscs01/tribo-app:${TRIBO_VERSION:?set TRIBO_VERSION to a release tag}
        target: /docker-entrypoint-initdb.d
        image: { subpath: app/packages/db/bootstrap }
      - type: image
        source: ghcr.io/eriscs01/tribo-app:${TRIBO_VERSION}
        target: /tribo/migrations
        image: { subpath: app/packages/db/migrations }
    shm_size: 256m
    healthcheck:
      # A query on the tribo database, not pg_isready: when the init script fails, the server
      # still starts but the database is missing, and db must then stay unhealthy.
      test: [CMD, psql, -U, postgres, -d, tribo, -Xqc, SELECT 1]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    <<: *service
    image: ghcr.io/eriscs01/tribo-app:${TRIBO_VERSION}
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    read_only: true
    cap_drop: [ALL]
    environment:
      TRIBO_PUBLIC_URL: ${TRIBO_PUBLIC_URL:?set TRIBO_PUBLIC_URL in .env}
      TRIBO_DB_HOST: db
      TRIBO_LOG_LEVEL: ${TRIBO_LOG_LEVEL:-info}
    secrets: [app_key, db_owner_password, db_app_password]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

  proxy:
    <<: *service
    image: ghcr.io/eriscs01/tribo-proxy:${TRIBO_VERSION}
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    # The mode's own secrets (DNS token, origin certificate) come from caddy/tls/<mode>.yml.
    extends:
      file: caddy/tls/${TRIBO_TLS_MODE:-acme-http}.yml
      service: proxy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      TRIBO_PUBLIC_URL: ${TRIBO_PUBLIC_URL}
      TRIBO_TLS_MODE: ${TRIBO_TLS_MODE:-acme-http}
      TRIBO_TRUSTED_PROXIES: ${TRIBO_TRUSTED_PROXIES:-none}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Cloudflare Tunnel mode only. Its public hostname points at https://proxy:443 with the
  # origin server name set to the public host (docs/runbook.md).
  tunnel:
    <<: *service
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: [tunnel, --no-autoupdate, run]
    read_only: true
    cap_drop: [ALL]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on: [proxy]

# Files in secrets/, never in git (docs/runbook.md step 7). Only the ones a running service
# mounts need to exist. Compose bind-mounts each file as it is on the host: uid, gid and mode
# apply only in Swarm, so the files are 644 for the container users and the secrets directory
# is 700, which keeps them from every other host user.
secrets:
  app_key:
    file: ./secrets/app_key
  db_superuser_password:
    file: ./secrets/db_superuser_password
  db_owner_password:
    file: ./secrets/db_owner_password
  db_app_password:
    file: ./secrets/db_app_password
  cloudflare_api_token:
    file: ./secrets/cloudflare_api_token
  origin_cert:
    file: ./secrets/origin_cert
  origin_key:
    file: ./secrets/origin_key
  tunnel_token:
    file: ./secrets/tunnel_token

volumes:
  pgdata:
  caddy_data:
  caddy_config:
