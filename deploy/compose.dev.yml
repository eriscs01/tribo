# Local dev stack: `pnpm dev:up` (secrets are generated on first run).
#   https://tribo.localhost → Caddy (internal CA) → /v1, /healthz: app (watch mode) → PostgreSQL 18
#                                                 → everything else: web (Vite, hot reload)
# The app runs from the repo bind mount with its own Linux node_modules in named volumes,
# so the Mac's node_modules are never used inside the container.
name: tribo-dev

x-node-modules: &node-modules
  - ..:/repo
  - pnpm_store:/root/.local/share/pnpm/store
  - nm_root:/repo/node_modules
  - nm_server:/repo/apps/server/node_modules
  - nm_web:/repo/apps/web/node_modules
  - nm_contract:/repo/packages/contract/node_modules
  - nm_core:/repo/packages/core/node_modules
  - nm_crypto:/repo/packages/crypto/node_modules
  - nm_db:/repo/packages/db/node_modules
  - nm_platform:/repo/packages/platform/node_modules
  - nm_testkit:/repo/packages/testkit/node_modules

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
    secrets: [db_superuser_password, db_owner_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../packages/db/bootstrap/10-tribo-init.sh:/docker-entrypoint-initdb.d/10-tribo-init.sh:ro
      - ../packages/db/migrations/0000_bootstrap.sql:/docker-entrypoint-initdb.d/tribo/0000_bootstrap.sql:ro
    ports:
      - 127.0.0.1:${TRIBO_DEV_DB_PORT:-55432}:5432
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, tribo]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: tribo-dev-app
    build:
      context: .
      dockerfile: dev/app.Dockerfile
    working_dir: /repo
    command: [sh, deploy/dev/app-start.sh]
    environment:
      TRIBO_PUBLIC_URL: https://tribo.localhost
      TRIBO_DB_HOST: db
      TRIBO_LOG_LEVEL: info
      # Edits made on the host reach the container without inotify events on some VMs
      # (Colima's default), so tsc polls; its own writes still wake `node --watch`.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    secrets: [db_owner_password, db_app_password, app_key]
    volumes: *node-modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 300s

  # The SPA through Vite's dev server. It starts after app, whose start installed and built
  # the workspace into the shared node_modules volumes.
  web:
    image: tribo-dev-app
    working_dir: /repo
    command: [pnpm, --filter, '@tribo/web', dev]
    environment:
      TRIBO_WEB_POLL: '1'
      TRIBO_WEB_HMR_PORT: ${TRIBO_DEV_HTTPS_PORT:-443}
    volumes: *node-modules
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/', { headers: { host: 'tribo.localhost' } }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    image: postgres:18.6
    secrets: [db_app_password]
    volumes:
      - ./dev/seed.sql:/seed.sql:ro
    entrypoint:
      - sh
      - -c
      - PGPASSWORD="$$(cat /run/secrets/db_app_password)" psql -h db -U tribo_app -d tribo -v ON_ERROR_STOP=1 -q -f /seed.sql
    depends_on:
      app:
        condition: service_healthy
    restart: 'no'

  proxy:
    image: caddy:2.11.7
    ports:
      - ${TRIBO_DEV_HTTP_PORT:-80}:80
      - ${TRIBO_DEV_HTTPS_PORT:-443}:443
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      seed:
        condition: service_completed_successfully
      web:
        condition: service_healthy

secrets:
  db_superuser_password:
    file: ./secrets/dev/db_superuser_password
  db_owner_password:
    file: ./secrets/dev/db_owner_password
  db_app_password:
    file: ./secrets/dev/db_app_password
  app_key:
    file: ./secrets/dev/app_key

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  pnpm_store:
  nm_root:
  nm_server:
  nm_web:
  nm_contract:
  nm_core:
  nm_crypto:
  nm_db:
  nm_platform:
  nm_testkit:
